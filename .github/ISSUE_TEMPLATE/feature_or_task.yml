name: Feature or task
description: Propose a scoped feature, improvement, or contributor task
title: ""
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or context
      description: What user or maintainer need does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the expected result and scope.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that will make this work complete.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Soroban contracts
        - SDK
        - API and indexer
        - Web application
        - Documentation
        - Security
        - DevOps
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety and privacy
      options:
        - label: I have considered authorization, funds, privacy, and regulatory boundaries where relevant.
          required: true

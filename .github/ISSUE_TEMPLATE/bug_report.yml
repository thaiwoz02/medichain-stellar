name: Bug report
description: Report a reproducible non-sensitive problem
title: "Bug: "
labels: []
body:
  - type: markdown
    attributes:
      value: For security vulnerabilities, do not open a public issue. Follow SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Soroban contracts
        - SDK
        - API and indexer
        - Web application
        - Documentation
        - CI or deployment
    validations:
      required: true

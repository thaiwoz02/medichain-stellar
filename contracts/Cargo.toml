[workspace]
resolver = "2"
members = [
  "participant_registry",
  "product_batch_registry",
  "order_escrow",
]

[workspace.dependencies]
soroban-sdk = "=29.0.1"

[profile.release]
opt-level = "z"
overflow-checks = true
panic = "abort"
lto = true
codegen-units = 1
strip = "symbols"
debug = 0

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
